# Kora Model Registry
#
# This is the SINGLE SOURCE OF TRUTH for all model IDs.
# No model ID appears anywhere else in the codebase.
#
# To change a model: edit model_id here. No code changes needed.
# To add a model: add an entry and assign the desired capability tag.
#
# Capability tags:
#   chat       — conversational responses
#   reason     — multi-step reasoning, planning
#   code       — code generation, analysis, debugging
#   vision     — image understanding
#   audio      — audio/speech understanding
#   embedding  — text embedding for RAG

models:
  # ── Chat ─────────────────────────────────────────────────────────────────────
  qwen-chat:
    provider: huggingface
    model_id: "Qwen/Qwen3-4B-Instruct-2507"
    capabilities:
      - chat
    context_window: 32768

  # ── Reasoning ─────────────────────────────────────────────────────────────────
  qwen-reason:
    provider: huggingface
    model_id: "Qwen/Qwen3.6-35B-A3B"
    capabilities:
      - reason
    context_window: 32768

  # ── Coding ────────────────────────────────────────────────────────────────────
  qwen-code:
    provider: huggingface
    model_id: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    capabilities:
      - code
    context_window: 32768

  # ── Vision ────────────────────────────────────────────────────────────────────
  gemma-vision:
    provider: huggingface
    model_id: "google/gemma-4-E4B-it"
    capabilities:
      - vision
    context_window: 131072

  # ── Audio ────────────────────────────────────────────────────────────────────
  gemma-audio:
    provider: huggingface
    model_id: "google/gemma-4-E4B-it"
    capabilities:
      - audio
    context_window: 32768

  # ── Embedding (RAG) ───────────────────────────────────────────────────────────
  embed-model:
    provider: huggingface
    model_id: "BAAI/bge-m3"
    capabilities:
      - embedding
    context_window: 8192
    dimension: 1024

  # ── Reranker (cross-encoder) ───────────────────────────────────────────────────
  reranker-model:
    provider: huggingface
    model_id: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    capabilities: []              # internal use only; not routable by capability tag
    context_window: 512
    dimension: null

  # ── Local Ollama Fallback ───────────────────────────────────────────────────
  ollama-chat:
    provider: ollama
    model_id: "qwen3:1.7b"
    capabilities:
      - chat
      - reason
      - code
    context_window: 32768
    metadata:
      local: true
      requires_network: false


