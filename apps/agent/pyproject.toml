[project]
name = "kora-agent"
version = "0.1.0"
description = "Kora — RAG-first autonomous AI agent backend"
requires-python = ">=3.11"

dependencies = [
    # ── API ──────────────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # ── Database ─────────────────────────────────────────────────────────────
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # ── Cache ────────────────────────────────────────────────────────────────
    "redis[hiredis]>=5.0.0",

    # ── AI / Models ──────────────────────────────────────────────────────────
    "huggingface-hub>=0.23.0",
    "httpx>=0.27.0",                  # async HTTP for HuggingFace API calls

    # ── RAG ──────────────────────────────────────────────────────────────────
    "sentence-transformers>=3.0.0",   # cross-encoder reranker
    "tiktoken>=0.7.0",                # token counting
    "chardet>=5.0.0",                 # encoding detection

    # ── Document parsing ──────────────────────────────────────────────────────
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "markdown-it-py>=3.0.0",

    # ── Web Research ─────────────────────────────────────────────────────────
    "tavily-python>=0.3.0",
    "duckduckgo-search>=6.0.0",

    # ── Browser automation ────────────────────────────────────────────────────
    "playwright>=1.44.0",

    # ── Task scheduling ───────────────────────────────────────────────────────
    "apscheduler>=3.10.0",

    # ── Observability ─────────────────────────────────────────────────────────
    "structlog>=24.0.0",

    # ── Utilities ─────────────────────────────────────────────────────────────
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.9",        # file upload support
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml",
    "types-aiofiles",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
