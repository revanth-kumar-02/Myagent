name: kora_desktop
description: "Kora — RAG-first autonomous personal AI agent (Desktop)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── WebSocket & HTTP ─────────────────────────────────────────────────────────
  web_socket_channel: ^3.0.0
  http: ^1.2.0

  # ── Platform / Desktop ───────────────────────────────────────────────────────
  window_manager: ^0.3.9
  file_picker: ^8.0.0
  path_provider: ^2.1.3

  # ── Data ─────────────────────────────────────────────────────────────────────
  sqflite: ^2.3.3           # local settings storage
  shared_preferences: ^2.2.3

  # ── Utilities ────────────────────────────────────────────────────────────────
  uuid: ^4.4.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  intl: ^0.19.0
  path: ^1.9.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2

flutter:
  uses-material-design: true

