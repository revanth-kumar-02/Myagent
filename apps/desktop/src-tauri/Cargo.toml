[package]
name = "cocoa"
version = "0.1.0"
description = "Cocoa Personal AI Agent"
authors = ["you"]
edition = "2021"

[lib]
name = "cocoa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
